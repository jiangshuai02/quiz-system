services:
  - type: web
    name: shuati-app
    runtime: static
    repo: https://github.com/jiangshuai02/quiz-system
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_APP_TITLE
        value: 王大拿刷题宝
