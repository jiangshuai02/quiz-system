<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 智能刷题系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(135deg,#eff6ff 0%,#f0fdf4 50%,#fefce8 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px
}
.container{
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-radius:16px;
  box-shadow:0 4px 6px rgba(0,0,0,.02),0 12px 30px rgba(0,0,0,.06);
  padding:48px 44px;width:100%;max-width:400px;border:1px solid rgba(226,232,240,.6)
}
.header{text-align:center;margin-bottom:36px}
.header .icon{font-size:44px;margin-bottom:12px;display:block}
.header h1{color:#1e293b;font-size:24px;font-weight:700;margin-bottom:6px}
.header p{color:#94a3b8;font-size:14px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:6px;color:#475569;font-weight:600;font-size:13px}
.form-group input{
  width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:10px;
  font-size:15px;transition:all .2s;background:#f8fafc;color:#1e293b;outline:none
}
.form-group input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1);background:#fff}
.error-msg{background:#fee2e2;color:#991b1b;padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:14px;text-align:center;border:1px solid #fecaca}
.btn-register{
  width:100%;padding:13px 16px;background:#3b82f6;color:#fff;border:none;border-radius:10px;
  font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px
}
.btn-register:hover{background:#2563eb;box-shadow:0 4px 14px rgba(59,130,246,.3);transform:translateY(-1px)}
.login-link{text-align:center;margin-top:24px;color:#94a3b8;font-size:14px}
.login-link a{color:#3b82f6;text-decoration:none;font-weight:600}
.login-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="icon">📚</span>
    <h1>智能刷题系统</h1>
    <p>创建新账号</p>
  </div>

  {% if error %}
  <div class="error-msg">❌ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn-register">创 建 账 号</button>
  </form>

  <div class="login-link">
    已有账号？<a href="{{ url_for('login') }}">立即登录</a>
  </div>
</div>
</body>
</html>
