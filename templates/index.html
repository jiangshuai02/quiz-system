<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能刷题系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;background:#f7f8fa;color:#333;min-height:100vh}
        a{text-decoration:none;color:inherit}
        
        /* 顶部导航 */
        .topbar{background:#fff;border-bottom:1px solid #e8e8e8;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
        .topbar-left{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#1a1a2e}
        .topbar-right{display:flex;align-items:center;gap:12px;font-size:13px;color:#888}
        .topbar-right a{padding:5px 12px;border-radius:6px;background:#f0f0f0;transition:.2s}
        .topbar-right a:hover{background:#e0e0e0}

        /* 主导航 */
        .main-nav{display:flex;background:#fff;border-bottom:1px solid #eee;padding:0 20px;overflow-x:auto}
        .nav-tab{padding:14px 22px;font-size:15px;font-weight:500;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
        .nav-tab:hover{color:#1890ff}
        .nav-tab.active{color:#1890ff;border-bottom-color:#1890ff}
        .nav-tab.admin-only{display:none}

        /* 内容区 */
        .page-wrap{max-width:900px;margin:0 auto;padding:30px 16px}
        .page{display:none}
        .page.active{display:block}

        /* ========== 模式选择页面（核心新UI）========== */
        .mode-select-title{font-size:17px;font-weight:600;margin-bottom:20px;color:#222}
        .mode-card-list{display:flex;flex-direction:column;gap:14px}
        .mode-card{
            background:#fff;border:1px solid #e8e8e8;border-radius:10px;
            padding:20px 24px;display:flex;align-items:center;gap:18px;
            cursor:pointer;transition:all .25s;position:relative
        }
        .mode-card:hover{border-color:#1890ff;box-shadow:0 4px 16px rgba(24,144,255,.12);transform:translateY(-1px)}
        .mode-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
        .mode-icon.shuffle{background:#e6f7ff;color:#1890ff}
        .mode-icon.sequential{background:#fff7e6;color:#fa8c16}
        .mode-icon.memorize{background:#f6ffed;color:#52c41a}
        .mode-icon.wrong{background:#fff1f0;color:#ff4d4f}
        .mode-info{flex:1}
        .mode-name{font-size:16px;font-weight:600;margin-bottom:3px;color:#1a1a2e}
        .mode-desc{font-size:13px;color:#999;line-height:1.4}
        .mode-arrow{color:#ccc;font-size:18px;flex-shrink:0}

        /* 科目选择器 */
        .subject-bar{margin-bottom:28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .subject-bar label{font-size:14px;font-weight:500;color:#555}
        .subject-bar select{
            padding:9px 14px;border:1.5px solid #d9d9d9;border-radius:8px;font-size:14px;
            background:#fff;cursor:pointer;min-width:180px;color:#333;outline:none;transition:border .2s
        }
        .subject-bar select:focus{border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.1)}

        /* 题目卡片 */
        .qcard{
            background:#fff;border:1px solid #e8e8e8;border-radius:12px;
            padding:28px 30px;margin-bottom:16px;position:relative;
            border-left:4px solid #1890ff
        }
        .qcard.memorize-mode{border-left-color:#52c41a}
        .qcard.wrong-mode{border-left-color:#ff4d4f}
        .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .qtype-badge{background:#e6f7ff;color:#096dd9;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600}
        .qnum{font-size:13px;color:#aaa;font-weight:600}
        .qtext{font-size:17px;line-height:1.75;color:#222;margin-bottom:20px;word-break:break-word}
        
        /* 选项列表 */
        .opt-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
        .opt-item{
            padding:14px 18px;border:1.5px solid #e8e8e8;border-radius:10px;
            cursor:pointer;transition:all .2s;font-size:15px;display:flex;align-items:center;gap:12px
        }
        .opt-item:hover{border-color:#1890ff;background:#fafbfc}
        .opt-item.selected{border-color:#1890ff;background:#e6f7ff;font-weight:600}
        .opt-item.correct{border-color:#52c41a;background:#f6ffed}
        .opt-item.wrong{border-color:#ff4d4f;background:#fff1f0}
        .opt-letter{width:30px;height:30px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#666;flex-shrink:0;font-size:13px}
        .opt-item.selected .opt-letter{background:#1890ff;color:#fff}
        .opt-item.correct .opt-letter{background:#52c41a;color:#fff}
        .opt-item.wrong .opt-letter{background:#ff4d4f;color:#fff}

        /* 填空输入 */
        .fill-input{width:100%;padding:14px;border:1.5px solid #e8e8e8;border-radius:10px;font-size:16px;margin-bottom:22px;outline:none;transition:border .2s}
        .fill-input:focus{border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.1)}

        /* 背题模式的答案展示 */
        .memorize-answer-box{
            background:#f6ffed;border:1px solid #b7eb8f;border-radius:10px;
            padding:16px 20px;margin-bottom:18px
        }
        .memorize-answer-label{font-size:12px;color:#389e0d;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
        .memorize-answer-text{font-size:18px;font-weight:700;color:#237804}
        .memorize-explain{font-size:14px;color:#666;margin-top:10px;padding-top:10px;border-top:1px dashed #d9f7be;line-height:1.6}

        /* 按钮组 */
        .btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
        .btn{
            padding:10px 22px;border:none;border-radius:8px;cursor:pointer;
            font-size:15px;font-weight:500;transition:all .2s
        }
        .btn-primary{background:#1890ff;color:#fff}.btn-primary:hover{background:#096dd9;box-shadow:0 4px 12px rgba(24,144,255,.25)}
        .btn-success{background:#52c41a;color:#fff}.btn-success:hover{background:#389e0d}
        .btn-danger{background:#ff4d4f;color:#fff}.btn-danger:hover{background:#cf1322}
        .btn-default{background:#f5f5f5;color:#666}.btn-default:hover{background:#e0e0e0}
        .btn-sm{padding:6px 14px;font-size:13px}
        .btn-lg{padding:13px 32px;font-size:17px}

        /* 反馈框 */
        .fb{padding:16px 20px;border-radius:10px;margin-top:16px;display:none;animation:fadeIn .25s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
        .fb.ok{background:#f6ffed;border:1px solid #b7eb8f;color:#237804}
        .fb.err{background:#fff1f0;border:1px solid #ffa39e;color:#cf1322}

        /* 进度条 */
        .pbar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin-top:18px}
        .pbar-fill{height:100%;background:linear-gradient(90deg,#1890ff,#36cfc9);transition:width .35s ease;border-radius:3px}
        .ptext{text-align:center;margin-top:8px;color:#bbb;font-size:13px}

        /* 题库页面 */
        .bank-toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
        .subj-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:18px;margin-bottom:14px}
        .subj-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0f0f0}
        .subj-name{font-size:16px;font-weight:600;color:#222}
        .subj-count{background:#e6f7ff;color:#096dd9;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
        .mini-q{padding:10px 14px;background:#fafafa;border-radius:6px;font-size:13px;margin-bottom:6px;border-left:3px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:8px}
        .mini-qt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:450px;color:#555}
        .mini-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
        .mini-tag{background:#f0f0f0;padding:2px 8px;border-radius:4px;font-size:11px;color:#888}
        .expand-btn{cursor:pointer;font-size:12px;color:#1890ff;background:none;border:1px solid #91caff;padding:3px 10px;border-radius:5px}
        .collapsed+.subj-body{display:none}

        /* 统计卡片 */
        .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
        .stat-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:22px;text-align:center}
        .stat-num{font-size:2.2em;font-weight:700;color:#1890ff;margin-bottom:4px}
        .stat-lbl{font-size:13px;color:#999}

        /* 上传区域 */
        .upload-zone{border:2px dashed #d9d9d9;border-radius:12px;padding:45px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:16px;background:#fafafa}
        .upload-zone:hover{border-color:#1890ff;background:#f0faff}
        .hidden{display:none!important}

        /* 错题空状态 */
        .empty-state{text-align:center;padding:50px 20px;color:#bbb}
        .empty-state .ei{font-size:50px;margin-bottom:12px}

        @media(max-width:768px){
            .topbar{padding:10px 14px}
            .page-wrap{padding:16px 10px}
            .nav-tab{padding:10px 14px;font-size:13px}
            .qtext{font-size:15px}
            .mode-card{padding:16px 18px}
            .mini-qt{max-width:200px}
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-left">📚 智能刷题系统</div>
    <div class="topbar-right">
        <span id="username-display"></span>
        <a href="/logout">退出</a>
    </div>
</div>

<div class="main-nav">
    <div class="nav-tab active" onclick="switchPage('practice')">✍️ 刷题</div>
    <div class="nav-tab" onclick="switchPage('bank')">📖 题库</div>
    <div class="nav-tab admin-only" onclick="switchPage('import')">📥 导入</div>
    <div class="nav-tab" onclick="switchPage('wrong')">❌ 错题本</div>
    <div class="nav-tab" onclick="switchPage('stats')">📊 统计</div>
</div>

<div class="page-wrap">
    <!-- ===== 刷题：模式选择 ===== -->
    <div id="practice" class="page active">
        <div class="subject-bar">
            <label>🎯 选择科目：</label>
            <select id="sub-select" onchange="onSubChange()">
                <option value="__all__">全部题目</option>
            </select>
        </div>

        <div class="mode-select-title">请选择答题模式：</div>
        <div class="mode-card-list">
            <!-- 乱序答题 -->
            <div class="mode-card" onclick="startMode('shuffle')">
                <div class="mode-icon shuffle">🔀</div>
                <div class="mode-info">
                    <div class="mode-name">乱序答题</div>
                    <div class="mode-desc">题目随机打乱，每次答案顺序都不同</div>
                </div>
                <div class="mode-arrow">›</div>
            </div>
            <!-- 顺序答题 -->
            <div class="mode-card" onclick="startMode('sequential')">
                <div class="mode-icon sequential">📑</div>
                <div class="mode-info">
                    <div class="mode-name">顺序答题</div>
                    <div class="mode-desc">按题库原始顺序答题，支持恢复进度</div>
                </div>
                <div class="mode-arrow">›</div>
            </div>
            <!-- 背题模式 -->
            <div class="mode-card" onclick="startMode('memorize')">
                <div class="mode-icon memorize">📖</div>
                <div class="mode-info">
                    <div class="mode-name">背题模式</div>
                    <div class="mode-desc">直接显示答案和解析，适合考前背诵</div>
                </div>
                <div class="mode-arrow">›</div>
            </div>
            <!-- 错题模式 -->
            <div class="mode-card" onclick="startMode('wrong')">
                <div class="mode-icon wrong">✕</div>
                <div class="mode-info">
                    <div class="mode-name">错题模式</div>
                    <div class="mode-desc">只练习之前做错的题目，针对性复习</div>
                </div>
                <div class="mode-arrow">›</div>
            </div>
        </div>
    </div>

    <!-- ===== 答题区域（所有模式共用）===== -->
    <div id="quiz-area" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
            <button class="btn btn-default btn-sm" onclick="backToModes()">← 返回选模式</button>
            <span id="current-mode-badge" style="background:#e6f7ff;color:#096dd9;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;"></span>
        </div>

        <div class="qcard" id="qcard">
            <div class="qhead">
                <span class="qtype-badge" id="qt">单选题</span>
                <span class="qnum" id="qn">0/0</span>
            </div>
            <div class="qtext" id="qx"></div>

            <!-- 背题模式答案区（默认隐藏）-->
            <div class="memorize-answer-box hidden" id="memo-box">
                <div class="memorize-answer-label">正确答案</div>
                <div class="memorize-answer-text" id="memo-ans"></div>
                <div class="memorize-explain" id="memo-exp"></div>
            </div>

            <div class="opt-list" id="qopts"></div>
            <input type="text" class="fill-input hidden" id="qfill" placeholder="请输入您的答案...">

            <div class="btn-row">
                <button class="btn btn-primary btn-lg" id="btn-submit" onclick="submitAns()">✅ 提交答案</button>
                <button class="btn btn-success hidden" id="btn-next" onclick="nextQ()">➡️ 下一题</button>
                <button class="btn btn-default hidden" id="btn-retry" onclick="retryQ()">🔄 再做一次</button>
                <button class="btn btn-default hidden" id="btn-save-pg" onclick="saveProgress()">💾 保存进度</button>
            </div>
            <div class="fb" id="qfb"></div>
        </div>

        <div class="pbar"><div class="pbar-fill" id="pb-fill" style="width:0%"></div></div>
        <div class="ptext" id="ptext">准备开始...</div>
    </div>

    <!-- ===== 题库管理 ===== -->
    <div id="bank" class="page">
        <div class="bank-toolbar">
            <button class="btn btn-primary" onclick="loadBank()">刷新</button>
            <span id="total-count" style="color:#999;font-size:13px;"></span>
        </div>
        <div id="bank-list"></div>
    </div>

    <!-- ===== 导入页面 ===== -->
    <div id="import" class="page">
        <div class="subj-card">
            <h3 style="margin-bottom:14px;">📄 Word文档导入</h3>
            <div style="background:#f0faff;border:1px solid #adc6ff;border-radius:8px;padding:14px;margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;color:#0050b3;display:block;margin-bottom:8px;">导入到哪个科目？</label>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <select id="imp-sub" style="flex:1;min-width:160px;padding:9px 14px;border:1.5px solid #d9d9d9;border-radius:8px;font-size:14px;"><option value="">-- 选择已有科目 --</option></select>
                    <input type="text" id="imp-newsub" placeholder="+ 新建科目" style="flex:1;min-width:120px;padding:9px 14px;border:1.5px solid #d9d9d9;border-radius:8px;font-size:14px;">
                </div>
            </div>
            <div class="upload-zone" id="up-zone">
                <p style="font-size:2.5em;">📄</p>
                <p style="font-size:16px;font-weight:600;margin:8px 0;">点击或拖拽Word文档到此区域</p>
                <p style="color:#bbb;font-size:13px;">支持 .docx 格式，自动识别题型</p>
                <input type="file" id="file-in" accept=".docx" class="hidden" onchange="handleFile()">
            </div>
            <div id="imp-status"></div>
        </div>

        <div class="subj-card">
            <h3 style="margin-bottom:14px;">✏️ 手动添加</h3>
            <form onsubmit="return addQ(event)">
                <div style="margin-bottom:10px;display:flex;gap:6px;align-items:center;"><label style="font-size:13px;width:70px;">科目：</label><select id="aq-sub" style="flex:1;padding:9px;border:1.5px solid #d9d9d9;border-radius:8px;font-size:13px;"></select><input type="text" id="aq-newsub" placeholder="+新建" style="width:110px;padding:9px;border:1.5px solid #d9d9d9;border-radius:8px;font-size:13px;"></div>
                <select id="aq-type" style="width:100%;padding:9px;margin:6px 0;border:1.5px solid #d9d9d9;border-radius:8px;font-size:14px;"><option value="single">单选</option><option value="multiple">多选</option><option value="judge">判断</option><option value="fill">填空</option><option value="essay">简答</option></select>
                <textarea id="aq-q" placeholder="题目内容" style="width:100%;padding:10px;margin:6px 0;min-height:80px;border:1.5px solid #d9d9d9;border-radius:8px;font-size:14px;"></textarea>
                <textarea id="aq-opts" placeholder="选项（每行一个）\n如：A. xxx\nB. xxx" style="width:100%;padding:10px;margin:6px 0;min-height:60px;border:1.5px solid #d9d9d9;border-radius:8px;font-size:14px;"></textarea>
                <input type="text" id="aq-ans" placeholder="正确答案" style="width:100%;padding:10px;margin:6px 0;border:1.5px solid #d9d9d9;border-radius:8px;font-size:14px;">
                <input type="text" id="aq-exp" placeholder="解析（可选）" style="width:100%;padding:10px;margin:6px 0;border:1.5px solid #d9d9d9;border-radius:8px;font-size:14px;">
                <button type="submit" class="btn btn-success" style="width:100%;">+ 添加题目</button>
            </form>
        </div>
    </div>

    <!-- ===== 错题本 ===== -->
    <div id="wrong" class="page">
        <div id="wrong-list"></div>
    </div>

    <!-- ===== 统计 ===== -->
    <div id="stats" class="page">
        <div class="stat-grid" id="sg"></div>
    </div>
</div>

<script>
// ==================== 全局状态 ====================
let qs = [], idx = 0, ans = null, role = 'user', sub = '__all__', mode = '';
let answered = 0, correct = 0, allSubs = [];

// ==================== 初始化 ====================
async function init(){
    await checkAuth();
    await loadSubs();
}

async function checkAuth(){
    const r = await fetch('/api/me'); const d = await r.json();
    role = d.role;
    document.getElementById('username-display').textContent = d.username + (d.role==='admin'?'(管理员)':'(用户)');
    if(role==='admin') document.querySelectorAll('.admin-only').forEach(e=>e.style.display='block');
}

function switchPage(pid){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(n=>n.classList.remove('active'));
    document.getElementById(pid).classList.add('active');
    event.target.classList.add('active');
    if(pid==='practice'){ showModeSelect(); }
    if(pid==='bank') loadBank();
    if(pid==='stats') loadStats();
    if(pid==='wrong') loadWrong();
}

// ==================== 科目加载 ====================
async function loadSubs(){
    const r = await fetch('/api/subjects'), data = await r.json(); allSubs = data;
    // 刷题页科目
    let total = allSubs.reduce((s,x)=>s+x.count,0);
    const s = document.getElementById('sub-select');
    s.innerHTML='<option value="__all__">全部题目 ('+total+'道)</option>';
    allSubs.forEach(x => { s.innerHTML+='<option value="'+esc(x.name)+'">'+esc(x.name)+' ('+x.count+'道)</option>'; });
    // 导入页
    const i = document.getElementById('imp-sub');
    if(i){ i.innerHTML='<option value="">-- 选择已有 --</option>'; allSubs.filter(x=>x.id>0).forEach(x=>{ i.innerHTML+='<option value="'+x.id+'">'+esc(x.name)+'</option>'; }); }
    // 手动添加页
    const a = document.getElementById('aq-sub');
    if(a){ a.innerHTML='<option value="">-- 默认 --</option>'; allSubs.filter(x=>x.id>0).forEach(x=>{ a.innerHTML+='<option value="'+x.id+'">'+esc(x.name)+'</option>'; }); }
}

function onSubChange(){ sub = document.getElementById('sub-select').value; }

// ==================== 模式切换 ====================
function showModeSelect(){
    document.getElementById('quiz-area').style.display='none';
    document.querySelector('.mode-select-title').parentElement.style.display='block';
    document.querySelector('.subject-bar').parentElement.style.display='block';
}

async function startMode(m){
    mode = m;
    document.getElementById('current-mode-badge').textContent = {
        'shuffle':'乱序答题', 'sequential':'顺序答题', 'memorize':'背题模式', 'wrong':'错题模式'
    }[m];

    // 根据模式加载不同数据
    try {
        if(m === 'wrong'){
            const r = await fetch('/api/wrong_questions');
            qs = await r.json();
        } else if(m === 'sequential'){
            const r = await fetch('/api/questions/sequential/'+encodeURIComponent(sub));
            qs = await r.json();
        } else {
            // shuffle / memorize 都用乱序API，memorize只是前端显示方式不同
            const r = await fetch('/api/questions/practice/'+encodeURIComponent(sub));
            qs = await r.json();
        }

        idx = 0; ans = null; answered = 0; correct = 0;

        if(!qs.length){
            document.getElementById('qx').innerHTML = '<div class="empty-state"><div class="ei">📭</div><p>'+(
                m==='wrong'?'太棒了！还没有错题记录':'该科目暂无题目，请先导入'
            )+'</p><p style="margin-top:6px;color:#ddd;">继续加油！</p></div>';
            return;
        }

        // 显示答题区
        document.querySelector('.mode-select-title').parentElement.style.display='none';
        document.querySelector('.subject-bar').parentElement.style.display='none';
        document.getElementById('quiz-area').style.display='block';

        showQ();

    } catch(e){ console.error(e); document.getElementById('qx').innerHTML='<span style="color:red">加载失败</span>'; }
}

// ==================== 显示题目 ====================
function showQ(){
    if(idx >= qs.length){ showFinish(); return; }
    const q = qs[idx];
    
    // 重置UI
    document.getElementById('qcard').className = 'qcard' + (mode==='wrong' ? ' wrong-mode' : '') + (mode==='memorize' ? ' memorize-mode' : '');
    document.getElementById('qt').textContent = getType(q.type);
    document.getElementById('qn').textContent = (idx+1)+'/'+qs.length;
    document.getElementById('qx').textContent = q.question || '(空)';
    document.getElementById('pb-fill').style.width = ((idx+1)/qs.length*100)+'%';
    document.getElementById('qfb').style.display='none';
    document.getElementById('btn-submit').style.display='inline-block';
    document.getElementById('btn-next').classList.add('hidden');
    document.getElementById('btn-retry').classList.add('hidden');

    // 进度保存按钮只在顺序模式下显示
    document.getElementById('btn-save-pg').style.display = mode === 'sequential' ? 'inline-block' : 'none';

    // 统计
    document.getElementById('ptext').textContent = '已答 '+answered+' | 正确 '+correct + (answered ? ' | 正确率 '+Math.round(correct/answered*100)+'%' : '');

    const optsDiv = document.getElementById('qopts');
    const fillIn = document.getElementById('qfill');

    // 背题模式：直接显示答案
    if(mode === 'memorize'){
        document.getElementById('memo-box').classList.remove('hidden');
        document.getElementById('memo-ans').textContent = q.answer;
        document.getElementById('memo-exp').textContent = q.explanation ? '💡 '+q.explanation : '';
    } else {
        document.getElementById('memo-box').classList.add('hidden');
    }

    if(q.type === 'fill' || q.type === 'essay'){
        optsDiv.innerHTML = ''; fillIn.classList.remove('hidden'); fillIn.value = ''; fillIn.focus();
    } else {
        fillIn.classList.add('hidden');
        let opts = q.options || [];
        if(q.type === 'judge' && (!opts || !opts.length)) opts = ['正确','错误'];

        // 乱序模式下额外打乱选项顺序
        if(mode === 'shuffle' && opts.length > 1){
            opts = [...opts].sort(() => Math.random() - 0.5);
        }

        let h = '';
        for(let i = 0; i < opts.length; i++){
            let L = String.fromCharCode(65+i);
            h += '<div class="opt-item" data-v="'+L+'" onclick="pickOpt(this,\''+L+'\')">' +
                '<span class="opt-letter">'+L+'</span><span class="opt-text">'+esc(opts[i])+'</span></div>';
        }
        optsDiv.innerHTML = h;
    }
    ans = null;

    // 背题模式自动标记正确答案
    if(mode === 'memorize' && q.options && q.options.length){
        markCorrectOpts(q);
    }
}

function markCorrectOpts(q){
    document.querySelectorAll('.opt-item').forEach(el=>{
        const v = el.dataset.v;
        if(String(q.answer).indexOf(v) >= 0) el.classList.add('correct');
    });
}

function pickOpt(el, v){
    const q = qs[idx];
    if(q.type === 'multiple'){
        el.classList.toggle('selected');
        updateMulti();
    } else {
        document.querySelectorAll('.opt-item').forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected');
        ans = v;
        if(mode !== 'memorize') submitAns();
    }
}

function updateMulti(){
    const sel = [];
    document.querySelectorAll('.opt-item.selected').forEach(o => sel.push(o.dataset.v));
    ans = sel.sort().join('');
    if(mode !== 'memorize' && sel.length > 0) submitAns();
}

// ==================== 提交答案 ====================
async function submitAns(){
    const q = qs[idx]; let a = ans;
    if(!a || (Array.isArray(a) && !a.length)){
        if(q.type === 'fill' || q.type === 'essay') a = document.getElementById('qfill').value.trim();
    }
    if(!a){ toast('请先选择或输入答案'); return; }
    document.getElementById('btn-submit').disabled = true;

    try {
        const r = await fetch('/api/check_answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_id:q.id,answer:a})});
        const d = await r.json();
        answered++; if(d.is_correct) correct++;

        showFb(d.is_correct,d.correct_answer,d.explanation,q);
        document.getElementById('btn-submit').style.display='none';
        document.getElementById('btn-next').classList.remove('hidden');
        document.getElementById('btn-retry').classList.remove('hidden');

        setTimeout(()=>{ nextQ(); }, 1800);

    } catch(e){ console.error(e); toast('提交失败'); }
    finally{ document.getElementById('btn-submit').disabled = false; }
}

function showFb(ok, cans, exp, q){
    const fb = document.getElementById('qfb');
    if(ok){
        fb.className='fb ok'; fb.innerHTML='<strong>✅ 回答正确！</strong>'+(exp?'<div style="margin-top:8px;font-size:13px;">💡 '+esc(exp)+'</div>':'');
        document.getElementById('qcard').className='qcard correct-answer';
    } else {
        fb.className='fb err'; 
        let h = '<strong>❌ 回答错误！</strong><div style="margin-top:8px;">正确答案：<strong>'+esc(cans)+'</strong></div>';
        markResultOpts(q,cans);
        if(exp) h += '<div style="margin-top:8px;font-size:13px;">💡 '+esc(exp)+'</div>';
        fb.innerHTML=h;
        document.getElementById('qcard').className='qcard wrong-answer';
    }
    fb.style.display='block';
}

function markResultOpts(q, ca){
    document.querySelectorAll('.opt-item').forEach(o=>{
        const v = o.dataset.v;
        if(String(q.answer).indexOf(v)>=0) o.classList.add('correct');
        else if(o.classList.contains('selected')) o.classList.add('wrong');
    });
}

function nextQ(){ idx++; showQ(); }
function retryQ(){ showQ(); }

function saveProgress(){
    localStorage.setItem('quiz_progress', JSON.stringify({mode, sub, index: idx}));
    toast('💾 进度已保存！');
}

// 检测是否有保存的进度
(function(){
    const saved = localStorage.getItem('quiz_progress');
    if(saved){
        const p = JSON.parse(saved);
        // 可以在这里提示用户恢复进度
    }
})();

function backToModes(){ showModeSelect(); }

function showFinish(){
    document.getElementById('qt').textContent='完成';
    document.getElementById('qn').textContent=qs.length+'/'+qs.length;
    const rate = answered?Math.round(correct/answered*100):0;
    document.getElementById('qx').innerHTML=
        '<div style="text-align:center;padding:30px;">'+
        '<h2 style="margin-bottom:14px;color:'+ (rate>=60?'#52c41a':'#ff4d4f')+';">'+(rate>=60?'🎉':'📋')+' 完成！</h2>'+
        '<p style="font-size:15px;margin:5px 0;">总题：<strong>'+qs.length+'</strong> | 已答：<strong>'+answered+'</strong></p>'+
        '<p style="font-size:15px;margin:5px 0;">正确：<strong>'+correct+'</strong> | 正确率：<strong>'+rate+'%</strong></p>'+
        '<button class="btn btn-primary" onclick="startMode(\''+mode+'\')" style="margin-top:18px;">🔄 再来一轮</button>'+
        '<button class="btn btn-default" onclick="backToModes()" style="margin-top:10px;">← 返回换模式</button>'+
        '</div>';
    document.getElementById('qopts').innerHTML='';
    document.getElementById('qfill').classList.add('hidden');
    document.getElementById('btn-submit').style.display='none';
    document.getElementById('btn-next').classList.add('hidden');
    document.getElementById('btn-retry').classList.add('hidden');
    document.getElementById('btn-save-pg').style.display='none';
    document.getElementById('qfb').style.display='none';
    document.getElementById('pb-fill').style.width='100%';
}

// ==================== 题库页面 ====================
let subsData = [];
async function loadBank(){
    const [qr,sr] = await Promise.all([fetch('/api/questions'),fetch('/api/subjects')]);
    const questions = await qr.json(), subsData = await sr.json();
    document.getElementById('total-count').textContent='共 '+questions.length+' 道 | '+subsData.length+' 个科目';
    const c = document.getElementById('bank-list');

    if(!subsData.length){ c.innerHTML='<div class="empty-state"><div class="ei">📭</div><p>暂无数据</p></div>'; return; }

    let h = '';
    if(role==='admin') h += '<div style="margin-bottom:14px;text-align:center;padding:12px;background:#f6ffed;border:1px dashed #b7eb8f;border-radius:8px;"><button class="btn btn-success" onclick="newSub()" style="padding:10px 24px;font-size:15px;">+ 新建科目</button></div>';

    subsData.forEach(s => {
        const sqs = questions.filter(x => x.subject === s.name);
        h += '<div class="subj-card">';
        h += '<div class="subj-head"><span class="subj-name">'+esc(s.name)+'</span><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">';
        const ts={}; sqs.forEach(x=>ts[x.type]=(ts[x.type]||0)+1);
        const tl={single:'单选',multiple:'多选',judge:'判断',fill:'填空',essay:'简答'};
        Object.keys(ts).forEach(t=>{ h+='<span class="mini-tag">'+(tl[t]||t)+' '+ts[t]+'</span>'; });
        h += '<span class="subj-count">'+sqs.length+'道</span>';
        if(role==='admin'){
            h+='<button class="expand-btn" onclick="editSub('+s.id+',\''+esc(s.name.replace(/'/g,"\\'")+'\')" style="background:#fff7e6;color:#d46b08;">编辑</button>';
            h+='<button class="expand-btn" onclick="delSub('+s.id+',\''+esc(s.name.replace(/'/g,"\\'")+'\')" style="background:#fff1f0;color:#cf1322;">删除</button>';
        }
        h+='<button class="expand-btn" onclick="this.parentElement.parentElement.parentElement.querySelector(\'.subj-body\').style.display=this.textContent.includes(\'展开\')?\'none\':\'block\';this.textContent=this.textContent.includes(\'展开\')?\'收起 ▲\':\'展开 ▼\';">收起 ▲</button>';
        h += '</div></div><div class="subj-body">';
        if(!sqs.length){ h += '<p style="text-align:center;color:#bbb;padding:16px;">暂无题目</p>'; }
        else sqs.forEach((qi,i)=>{
            h+='<div class="mini-q"><span class="mini-qt">'+(i+1)+'.['+getType(qi.type)+'] '+esc(qi.question.substring(0,48))+(qi.question.length>48?'...':'')+'</span><div class="mini-meta"><span class="mini-tag">'+getType(qi.type)+'</span>';
            if(role==='admin'){
                h+='<select onchange="moveQ('+qi.id+',this.value);this.value=\'\';" style="padding:3px 7px;border:1px solid #ddd;border-radius:4px;font-size:11px;color:#888;"><option value="">→ 移动到</option>';
                subsData.filter(s2=>s2.name!==s.name).forEach(s2=>{ h+='<option value="'+s2.id+'">'+esc(s2.name)+'</option>'; });
                h+='</select><button class="btn btn-danger btn-sm" onclick="delQ('+qi.id+')">删</button>';
            }
            h+='</div></div>';
        });
        h += '</div></div>';
    });
    c.innerHTML = h;
}

function toggleSub(btn){ const card = btn.closest('.subj-card'); card.classList.toggle('collapsed'); btn.textContent = card.classList.contains('collapsed') ? '展开 ▼' : '收起 ▲'; }

async function moveQ(qid,tid){ if(!tid) return; try{ const r = await fetch('/api/move_question',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_ids:[qid],target_subject_id:+tid})}); alert(r.ok?'移动成功':r.error); loadBank(); loadSubs(); }catch(e){alert('失败:'+e.message);} }

function newSub(){ const n=prompt('输入新科目名称：',''); if(!n||!n.trim()) return; fetch('/api/subjects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.trim()})}).then(r=>r.json()).then(d=>{ alert(d.success?'✅ '+d.name:'创建失败：'+d.error); loadBank(); loadSubs(); }).catch(e=>alert('请求失败')); }

async function editSub(sid,on){ const n=prompt('修改名称：',on); if(!n||n.trim()===''||n.trim()===on) return; fetch('/api/subjects/'+sid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.trim()})}).then(r=>r.json()).then(d=>{ alert(d.success?'已修改':'失败：'+d.error); loadBank(); loadSubs(); }).catch(e=>alert('修改失败')); }

async function delSub(sid,nm){ if(!confirm('确定删除「'+nm+'」？')) return; fetch('/api/subjects/'+sid,{method:'DELETE'}).then(r=>r.json()).then(d=>{ alert(d.message||'删除成功'); loadBank(); loadSubs(); }).catch(e=>alert('删除失败')); }

async function delQ(id){ if(!confirm('确定删除？')) return; fetch('/api/questions/'+id,{method:'DELETE'}).then(r=>r.json()).then(d=>{ if(d.success){alert('已删除'); loadBank(); loadSubs();}else alert('失败：'+d.error); }) }

// ==================== 错题本 ====================
async function loadWrong(){
    const r = await fetch('/api/wrong_questions'), ws = await r.json();
    const c = document.getElementById('wrong-list');
    if(!ws.length){ c.innerHTML='<div class="empty-state"><div class="ei">🎉</div><p>还没有错题记录</p><p style="margin-top:6px;color:#ddd;">继续加油！</p></div>'; return; }
    let h='<p style="color:#888;margin-bottom:14px;">共 '+ws.length+' 道错题</p>';
    ws.forEach((w,i)=>{ h+='<div class="qcard wrong-answer" style="margin-bottom:12px;"><div class="qhead"><span class="qtype-badge">'+getType(w.type)+'</span><span class="qnum">#'+(i+1)+' | '+esc(w.subject)+'</span></div><div class="qtext">'+esc(w.question)+'</div><div style="background:#fff1f0;padding:12px;border-radius:8px;margin-top:10px;font-size:13px;"><strong>你的答案：</strong>'+esc(w.user_answer)+' → <strong>正确答案：</strong>'+esc(w.answer)+(w.explanation?'<br><span style="opacity:0.7;">💡 '+esc(w.explanation)+'</span>')+'</div></div>'; });
    c.innerHTML = h;
}

// ==================== 统计 ====================
async function loadStats(){
    const r = await fetch('/api/statistics'), st = await r.json();
    document.getElementById('sg').innerHTML = [
        sc(st.total,'总题库','📚'),sc(st.answered,'已答','✍️'),
        sc(st.correct,'正确','✅'),sc(st.accuracy+'%','正确率','📊')
    ].join('');
}
function sc(n,l,i){ return '<div class="stat-card"><div class="stat-num">'+n+'</div><div class="stat-lbl">'+i+' '+l+'</div></div>'; }

// ==================== 文件上传 ====================
const uz=document.getElementById('up-zone'), fi=document.getElementById('file-in');
if(uz){uz.onclick=()=>fi.click(); uz.ondragover=e=>{e.preventDefault();uz.style.background='#e6f7ff'}; uz.ondragleave=()=>uz.style.background=''; uz.ondrop=e=>{e.preventDefault();uz.style.background=''; uploadF(e.dataTransfer.files[0])}; }
function handleFile(){ uploadF(fi.files[0]); }

async function uploadF(file){
    if(!file) return;
    const fd=new FormData(); fd.append('file',file);
    const sid=document.getElementById('imp-sub').value||'', ns=document.getElementById('imp-newsub').value.trim()||'';
    if(sid) fd.append('subject_id',sid); if(ns) fd.append('new_subject_name',ns);
    if(!sid&&!ns){ alert('请选择或新建科目'); return; }
    document.getElementById('imp-status').innerHTML='<p style="color:#1890ff;padding:12px;">⏳ 导入中...</p>';
    try{
        const r=await fetch('/api/import_word',{method:'POST',body:fd}), d=await r.json();
        if(d.error) document.getElementById('imp-status').innerHTML='<p style="color:#ff4d4f;padding:12px;">❌ '+d.error+'</p>';
        else{ document.getElementById('imp-status').innerHTML='<p style="color:#52c41a;padding:12px;">✅ '+(d.message||'成功导入'+d.count+'道')+'</p>'; loadSubs(); document.getElementById('imp-newsub').value=''; }
    } catch(e){ document.getElementById('imp-status').innerHTML='<p style="color:#ff4d4f;padding:12px;">❌ 上传失败</p>'; }
}

// ==================== 添加题目 ====================
async function addQ(ev){ ev.preventDefault();
    const t=document.getElementById('aq-type').value; let sid=null, sn='默认科目';
    const sv=document.getElementById('aq-sub').value, ns=document.getElementById('aq-newsub').value.trim();
    if(ns){ const cr=await fetch('/api/subjects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ns})}); const cd=await cr.json(); sid=cd.success?cd.id:(cd.id||null); sn=ns; document.getElementById('aq-newsub').value=''; }
    else if(sv) sid=parseInt(sv);
    const q=document.getElementById('aq-q').value.trim(), ot=document.getElementById('aq-opts').value.trim().split('\n').filter(x=>x.trim()), a=document.getElementById('aq-ans').value.trim(), e=document.getElementById('aq-exp').value.trim();
    if(!q||!a){ alert('题目和答案不能为空'); return false; }
    const body={type:t,question:q,options:ot,answer:a,explanation:e};
    if(sid) body.subject_id=sid; else body.subject_name=sn;
    const r=await fetch('/api/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const rd=await r.json();
    if(rd.success){ alert('✅ 添加成功'); ['aq-q','aq-opts','aq-ans','aq-exp'].forEach(i=>document.getElementById(i).value=''); loadSubs(); }
    else alert('添加失败：'+rd.error); return false;
}

// ==================== 工具函数 ====================
function getType(t){ return {single:'单选题',multiple:'多选题',judge:'判断题',fill:'填空题',essay:'简答题'}[t]||t; }
function esc(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toast(m){ const t=document.createElement('div'); t.textContent=m; t.style.cssText='position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:14px 26px;border-radius:10px;z-index:9999;font-size:14px;'; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

// 启动
init();
</script>
