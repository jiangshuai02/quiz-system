<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能刷题系统 - 输入名字</title>
<style>
:root{--primary:#3b82f6;--primary-light:#60a5fa;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;
  --text:#1e293b;--text-secondary:#64748b;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.name-card{background:var(--card);border-radius:var(--radius);padding:48px 40px;max-width:420px;width:100%;box-shadow:0 25px 50px rgba(0,0,0,.15);text-align:center}
.name-icon{font-size:56px;margin-bottom:20px;display:block}
.name-title{font-size:24px;font-weight:800;color:var(--text);margin-bottom:8px}
.name-subtitle{font-size:14px;color:var(--text-secondary);margin-bottom:32px}
.name-input{width:100%;padding:16px 20px;border:2px solid var(--border);border-radius:12px;font-size:18px;text-align:center;outline:none;transition:.25s;margin-bottom:20px;background:var(--bg)}
.name-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.name-btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark,#2563eb));cursor:pointer;transition:.25s}
.name-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,.35)}
.name-hint{font-size:12px;color:var(--text-muted);margin-top:16px}
@media(max-width:480px){.name-card{padding:36px 28px}.name-input{font-size:16px;padding:14px}}
</style>
</head>
<body>
<div class="name-card">
  <span class="name-icon">📚</span>
  <div class="name-title">智能刷题系统</div>
  <div class="name-subtitle">请输入你的名字开始刷题</div>
  <input type="text" id="name-in" class="name-input" placeholder="输入你的名字，如：张三" autofocus maxlength="30"
    onkeydown="if(event.key==='Enter')go()">
  <button class="name-btn" onclick="go()">🚀 开始刷题 →</button>
  <div class="name-hint">你的答题记录会以这个名字保存到数据库中</div>
</div>

<script>
function go() {
  const name = document.getElementById('name-in').value.trim();
  if (!name) { alert('请输入你的名字！'); document.getElementById('name-in').focus(); return; }
  if (name.length > 30) { alert('名字太长了（最多30个字）'); return; }
  
  fetch('/api/set_name', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name}) })
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        localStorage.setItem('current_user_name', name);
        location.href = '/';
      } else {
        alert(d.error || '设置失败');
      }
    })
    .catch(() => alert('网络错误'));

  // 尝试恢复之前保存的名字
  const saved = localStorage.getItem('current_user_name');
  if (saved && saved !== '') {
    document.getElementById('name-in').value = saved;
    document.getElementById('name-in').select();
  }
}

// 恢复保存的名字
const saved = localStorage.getItem('current_user_name');
if (saved && saved !== '') {
  document.getElementById('name-in').value = saved;
}
</script>
</body>
</html>
